
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>SIMCT - Hortolândia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F9FAFB;
            color: #1F2937;
            margin: 0;
            padding: 0;
        }
        @keyframes pulse-yellow {
            0%, 100% { border-color: #EAB308; box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); }
            50% { border-color: #FACC15; box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
        }
        .animate-pulse-yellow {
            animation: pulse-yellow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .tooltip-trigger:hover .tooltip-content {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .tooltip-content {
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.2s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
